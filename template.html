<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{head}}
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2c3 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 3 4 3 4s-1-6 2-10z' fill='%23ff8a2b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Сгенерировано build.js из template.html — не править вручную -->

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-crown" viewBox="0 0 24 24"><path fill="currentColor" d="M3 7l4 4 5-7 5 7 4-4-2 12H5L3 7z"/></symbol>
  <symbol id="i-sword" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M14 4h6v6L9 21l-6-6L14 4zM5 13l6 6M3 21l3-3"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path fill="currentColor" d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4V4zm16 0h-4a3 3 0 0 0-3 3"/></symbol>
</svg>

<header>
  <div class="embers" id="embers"></div>
  <div class="wrap">
    <div class="brand">
      <h1 class="logo"><img src="/img/logo.webp" width="480" height="244" alt="TLI FAQ — Torchlight: Infinite" fetchpriority="high"></h1>
      <p class="sub" data-i="subtitle"></p>
    </div>
    <div class="league" id="league">
      <span class="badge" id="sBadge"></span>
      <div class="lg-name" id="sLeague"></div>
      <p class="lg-state" id="lgState" data-i="leagueSoon"></p>
      <div class="countdown" id="cd"></div>
      <p class="lg-date"><span data-i="seasonStart"></span>: <b id="sStart"></b></p>
    </div>
    <p class="upd"><span class="dot"></span><span data-i="lastUpd"></span> <b id="sUpd"></b> <span id="sAgo"></span> · <a class="log-link" id="logLink" href="/changelog/"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span data-i="changelog"></span></a></p>
    <div class="actions">
      <button class="like" id="likeBtn" hidden><span class="heart">♥</span> <span data-i="like"></span> <b id="likeN"></b></button>
    </div>
    <p class="note" id="sNote"></p>
  </div>
</header>

<nav><div class="wrap">
  <a href="#tiers"><svg><use href="#i-crown"/></svg><span data-i="navTiers"></span></a><a href="#builds"><svg><use href="#i-sword"/></svg><span data-i="navBuilds"></span></a><a href="#guides"><svg><use href="#i-book"/></svg><span data-i="navGuides"></span></a><a href="#changes"><svg><use href="#i-bolt"/></svg><span data-i="navChanges"></span></a><a href="#sources"><svg><use href="#i-list"/></svg><span data-i="navSources"></span></a>
  <div class="seg lang" id="langSeg"></div>
</div></nav>

<main class="wrap">
  <section id="tiers">
    <h2><svg><use href="#i-crown"/></svg><span data-i="tiersTitle"></span></h2>
    <div class="method"><b>ⓘ <span data-i="methodTitle"></span></b><p data-i="methodText"></p><p data-i="methodPets"></p></div>
    <div class="phases" id="tierSeg"></div>
    <div class="legend"><span><b style="background:var(--up);color:#052e14">▲</b><span data-i="legendUp"></span></span><span><b style="background:var(--down);color:#3b0909">▼</b><span data-i="legendDown"></span></span><span><b style="background:var(--new);color:#06213f">✦</b><span data-i="legendNew"></span></span><span data-i="legendClick"></span></div>
    <div id="tierList"></div>
    <div class="detail" id="detail"></div>
  </section>

  <section id="builds">
    <h2><svg><use href="#i-sword"/></svg><span data-i="buildsTitle"></span></h2>
    <p class="lead" data-i="buildsLead"></p>
    <div class="filters">
      <div class="seg" id="stageSeg"></div>
      <select id="heroSel"></select>
      <button class="chip-reset" id="resetHero" type="button" hidden></button>
      <input id="q" type="search">
    </div>
    <table class="tbl">
      <thead><tr>
        <th data-k="hero" data-i="thHero"></th><th data-k="tier" data-i="thTier"></th><th data-k="name" data-i="thBuild"></th><th data-i="thSkill"></th>
        <th data-k="stage" data-i="thStage"></th><th data-k="budget" data-i="thBudget"></th><th data-k="diff" data-i="thDiff"></th><th data-k="trend">SS14</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <section id="guides">
    <h2><svg><use href="#i-book"/></svg><span data-i="guidesTitle"></span></h2>
    <p class="lead" data-i="guidesLead"></p>
    <table class="gtbl">
      <thead><tr><th data-i="thHero"></th><th data-i="thBuild"></th><th data-i="thGuide"></th><th data-i="thAuthor"></th><th data-i="thCode"></th></tr></thead>
      <tbody id="guidesBody"></tbody>
    </table>
  </section>

  <section id="changes">
    <h2><svg><use href="#i-bolt"/></svg><span data-i="changesTitle"></span></h2>
    <p class="lead" data-i="changesLead"></p>
    <div class="changes" id="chList"></div>
  </section>

  <section id="sources">
    <h2><svg><use href="#i-list"/></svg><span data-i="sourcesTitle"></span></h2>
    <h3 class="sub-h" data-i="authorsTitle"></h3>
    <p class="lead" data-i="authorsNote"></p>
    <div class="authors-list" id="authorsList"></div>
    <h3 class="sub-h" data-i="sourcesSub"></h3>
    <ul class="src" id="srcList"></ul>
  </section>
</main>

<footer class="wrap">
  <h3 class="idx-title" data-i="heroesIdx"></h3>
  <div class="heroes-idx" id="heroIdx"></div>
  <span data-i="footer"></span>
  <div class="views" id="views" hidden></div>
</footer>

<div class="tips" id="tips">
<a class="tip" id="tip" href="https://pay.cloudtips.ru/p/1d7ab283" target="_blank" rel="noopener"><span class="ci">☕</span><span data-i="tip"></span></a>
<a class="tip boosty" id="boosty" href="https://boosty.to/azzka/donate" target="_blank" rel="noopener"><span class="bi">B</span><span data-i="boosty"></span></a>
</div>

<script src="/data.js"></script>
<script src="/render.js"></script>
<script>
const {D, H, esc, label, img, pageUrl, tierOf} = TLI, $ = s => document.querySelector(s);
const lang = document.documentElement.lang;
const qLang = new URLSearchParams(location.search).get("lang"); // старые ссылки ?lang=..
if (qLang && qLang !== lang) location.replace(qLang === "ru" ? "/ru/" : "/");
const t = k => TLI.T(lang, k), L = x => TLI.L(lang, x), loc = lang === "ru" ? "ru-RU" : "en-US";
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// Меню: подсветка раздела, который сейчас на экране
const navA = [...document.querySelectorAll("nav .wrap > a")];
const navIO = new IntersectionObserver(es => es.forEach(e => e.isIntersecting &&
  navA.forEach(a => a.classList.toggle("on", a.hash === "#" + e.target.id))), {rootMargin: "-45% 0px -50% 0px"});
document.querySelectorAll("main section").forEach(s => navIO.observe(s));

// Шапка: искры, время обновления в часовом поясе посетителя, таймер
for (let i = 0; i < 28; i++) {
  const e = document.createElement("i");
  e.style.cssText = `left:${Math.random()*100}%;animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*6}s`;
  $("#embers").append(e);
}
const upd = new Date(D.season.updatedAt), hrs = Math.round((upd - Date.now()) / 36e5);
$("#sUpd").textContent = upd.toLocaleString(loc, {dateStyle: "medium", timeStyle: "short"});
$("#sAgo").textContent = "(" + new Intl.RelativeTimeFormat(loc, {numeric: "auto"}).format(Math.abs(hrs) < 24 ? hrs : Math.round(hrs / 24), Math.abs(hrs) < 24 ? "hour" : "day") + ")";
function tick() {
  const ms = new Date(D.season.start) - Date.now();
  if (ms <= 0) { $("#league").classList.add("live"); $("#lgState").textContent = t("leagueLive"); $("#cd").innerHTML = ""; return; }
  const p = [Math.floor(ms/864e5), Math.floor(ms/36e5)%24, Math.floor(ms/6e4)%60, Math.floor(ms/1e3)%60];
  $("#cd").innerHTML = p.map((v,i) => `<div><b>${String(v).padStart(2,"0")}</b><span>${t("units")[i]}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);

function seg(el, opts, cur, onPick) {
  el.innerHTML = opts.map(([k,txt]) => `<button data-k="${k}" class="${k===cur?"on":""}">${txt}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); onPick(b.dataset.k); };
}

// Тир-листы
let mode = "starter", selected = null;
const DETAIL = $("#detail");
function renderTiers() {
  $("#tierList").after(DETAIL); // вынуть плашку, пока перерисовываем список
  $("#tierList").innerHTML = TLI.tiersHTML(lang, mode, selected);
  if (!selected) return;
  showDetail(selected);
  $("#tierList").querySelector(`.hcard[data-id="${selected}"]`).closest(".tier").after(DETAIL); // плашка — сразу под рядом героя
}
$("#tierSeg").onclick = e => { const b = e.target.closest(".phase"); if (!b || b.dataset.k === mode) return;
  mode = b.dataset.k; // классы, а не перерисовка — чтобы плашка и уголок переезжали анимацией
  $("#tierSeg").querySelectorAll(".phase").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
  $("#tierSeg .ph-switch").className = "ph-switch " + mode;
  const p = $("#tierSeg .ph-panel"); p.className = "ph-panel " + mode; p.innerHTML = TLI.phasePanelHTML(lang, mode);
  renderTiers(); };
$("#tierList").onclick = e => { const c = e.target.closest(".hcard"); if (!c) return;
  selected = selected === c.dataset.id ? null : c.dataset.id; renderTiers();
  if (selected) DETAIL.scrollIntoView({block:"nearest", behavior:"smooth"}); else DETAIL.classList.remove("show"); };

function showDetail(id) {
  const st = tierOf("starter", id), en = tierOf("endgame", id);
  const builds = D.builds.map((b, i) => ({...b, i})).filter(b => b.hero === id);
  const tierBox = (x, list) => `<div class="d-tier" style="--tc:var(--${x.t})"><span class="tb" style="background:var(--${x.t})">${x.t}</span>
      <div><b>${D.tiers[list].icon} ${esc(L(D.tiers[list].title))}</b><p>${esc(L(x.r[2]))}</p></div></div>`;
  const card = b => `<button class="d-build" data-i="${b.i}" style="--tc:var(--${b.tier})">
      <span class="d-btop"><span class="tb" style="background:var(--${b.tier})">${b.tier}</span><span class="d-bname">${esc(L(b.name))}</span></span>
      <span class="d-bskill">${esc(L(b.skill))}</span>
      <span class="d-bfoot"><span class="tag">${t(b.stage)}</span><span class="dots" title="${t("thBudget")}">${TLI.dots(b.budget)}</span>
        ${(b.links || []).length ? `<span class="d-guides">📖 ${b.links.length}</span>` : ""}<span class="d-go">${t("openInTable")} ↓</span></span>
    </button>`;
  DETAIL.innerHTML = `
    <button class="d-close" type="button" title="${t("close")}">✕</button>
    <div class="d-head">
      <img src="${img(id)}" alt="${label(id)}">
      <div>
        <h3 class="serif">${label(id)}</h3>
        <div class="d-trait">${esc(H[id].trait)}</div>
        <a class="d-page" href="${pageUrl(lang, id)}">${t("heroPage")} <span>— ${t("heroPageHint")}</span> →</a>
      </div>
    </div>
    <div class="d-tiers">${tierBox(st, "starter")}${tierBox(en, "endgame")}</div>
    <div class="d-btitle">${t("heroBuilds")} · ${builds.length}</div>
    ${builds.length ? `<div class="d-builds">${builds.map(card).join("")}</div>` : `<p class="lead">${t("noBuildsShort")}</p>`}`;
  DETAIL.classList.add("show");
}
DETAIL.onclick = e => {
  if (e.target.closest(".d-close")) { selected = null; renderTiers(); DETAIL.classList.remove("show"); return; }
  const c = e.target.closest(".d-build"); if (!c) return;
  const i = +c.dataset.i;
  $("#heroSel").value = D.builds[i].hero; open.add(i);
  if (stage !== "all") $('#stageSeg [data-k="all"]').click(); else renderBuilds();
  document.querySelector(`tr.row[data-i="${i}"]`).scrollIntoView({block: "center", behavior: "smooth"});
};

// Таблица билдов
let stage = "all", sortK = "tier", sortDir = 1, open = new Set();
seg($("#stageSeg"), [["all",t("all")],["start",t("start")],["end",t("end")]], stage, k => { stage = k; renderBuilds(); });
$("#heroSel").onchange = $("#q").oninput = () => renderBuilds();
document.querySelector(".tbl thead").onclick = e => { const th = e.target.closest("th[data-k]"); if (!th) return;
  sortDir = sortK === th.dataset.k ? -sortDir : 1; sortK = th.dataset.k; renderBuilds(); };
function renderBuilds() {
  const rows = TLI.buildRows(lang, {stage, hero: $("#heroSel").value, q: $("#q").value.trim().toLowerCase(), sortK, sortDir});
  document.querySelectorAll(".tbl th[data-k]").forEach(th =>
    th.innerHTML = (th.dataset.i ? t(th.dataset.i) : "SS14") + (th.dataset.k === sortK ? ` <span class="arr">${sortDir>0?"▲":"▼"}</span>` : ""));
  $("#tbody").innerHTML = TLI.buildsHTML(lang, rows, open);
  const h = $("#heroSel").value;
  $("#resetHero").hidden = !h;
  if (h) $("#resetHero").innerHTML = `${label(h)} <b>✕</b> <span>${t("showAll")}</span>`;
}
$("#tbody").onclick = e => { if (e.target.closest("a")) return; const r = e.target.closest("tr.row"); if (!r) return;
  const i = +r.dataset.i; open.has(i) ? open.delete(i) : open.add(i); renderBuilds(); };
$("#resetHero").onclick = () => { $("#heroSel").value = ""; renderBuilds(); };
renderBuilds();

// Лайки и уникальные просмотры (Cloudflare Pages Function + D1). Нет бэкенда — блоки скрыты.
let stats = null;
const visitor = store.get("visitor") || crypto.randomUUID();
store.set("visitor", visitor);
function renderStats() {
  if (!stats) return;
  $("#likeBtn").hidden = $("#views").hidden = false;
  $("#likeBtn").classList.toggle("on", stats.liked);
  $("#likeN").textContent = stats.likes;
  $("#views").textContent = `👁 ${stats.views}`; $("#views").title = t("views");
}
async function sendStats(extra) {
  try {
    const r = await fetch("/api/stats", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id: visitor, ...extra }) });
    if (r.ok) { stats = await r.json(); renderStats(); }
  } catch {}
}
function burst() {
  const btn = $("#likeBtn"), heart = btn.querySelector(".heart");
  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("i"), a = i / 14 * 2 * Math.PI, r = 28 + Math.random() * 22;
    s.className = "spark";
    s.style.cssText = `--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r}px;--c:${["#ff4d4d","#ff8a2b","#ffcf6b"][i % 3]}`;
    heart.append(s); setTimeout(() => s.remove(), 750);
  }
}
$("#likeBtn").onclick = () => {
  stats.liked = !stats.liked; if (stats.liked) burst(); stats.likes += stats.liked ? 1 : -1; renderStats(); // сразу, не дожидаясь сервера
  sendStats({ like: stats.liked });
};
sendStats();

// Подсветка пункта меню
const links = [...document.querySelectorAll('nav a[href^="#"]')];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting)
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), {rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("main section").forEach(s => io.observe(s));
</script>
</body>
</html>
