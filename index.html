<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI FAQ — тир-листы Torchlight: Infinite</title>
<meta name="description" content="Тир-листы героев и билдов Torchlight: Infinite, сезон SS14 Tartarus">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2c3 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 3 4 3 4s-1-6 2-10z' fill='%23ff8a2b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a0d; --bg2:#141217; --card:#1a171e; --line:#2c2733; --text:#ece6dc; --muted:#9a91a3;
  --fire:#ff8a2b; --fire2:#ffcf6b; --up:#4ade80; --down:#f87171; --new:#60a5fa;
  --S:#ff4d4d; --A:#ff9f3d; --B:#f5d547; --C:#7cc7a0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;
  background-image:radial-gradient(1200px 500px at 50% -150px,#ff8a2b22,transparent 70%)}
a{color:var(--fire2)}
h1,h2,.serif{font-family:Cinzel,serif;letter-spacing:.04em}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Шапка */
header{position:relative;overflow:hidden;padding:56px 0 36px;text-align:center}
header::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 20% 120%,#ff5a1a33,transparent 40%),radial-gradient(circle at 80% 130%,#ffb34733,transparent 40%)}
.embers{position:absolute;inset:0;pointer-events:none}
.embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--fire2);
  box-shadow:0 0 8px 2px var(--fire);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-320px) translateX(30px);opacity:0}}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border:1px solid #ff8a2b55;border-radius:999px;
  background:#ff8a2b14;color:var(--fire2);font-size:13px;font-weight:600}
h1{position:relative;margin:16px 0 6px;font-size:clamp(30px,6vw,56px);font-weight:800;
  background:linear-gradient(180deg,#fff2d6,var(--fire) 70%,#c2410c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px #ff8a2b55)}
.sub{position:relative;color:var(--muted);margin:0}
.countdown{position:relative;display:flex;gap:10px;justify-content:center;margin-top:22px}
.countdown div{min-width:68px;padding:10px 8px;background:#ffffff08;border:1px solid var(--line);border-radius:12px}
.countdown b{display:block;font:800 26px Cinzel,serif;color:var(--fire2)}
.countdown span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.upd{position:relative;display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px;margin:12px 0 0;padding:6px 14px;border-radius:999px;background:#ffffff08;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.upd b{color:var(--text);font-weight:600}
.upd .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.note{position:relative;max-width:720px;margin:20px auto 0;font-size:13px;color:var(--muted)}

/* Навигация */
nav{position:sticky;top:0;z-index:10;background:#0b0a0dcc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;padding:14px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
nav .lang{margin:6px 0 6px auto;flex:none;position:sticky;right:0;box-shadow:-12px 0 12px var(--bg)}
nav .lang button{padding:5px 10px;font-size:12px}
nav a:hover,nav a.on{color:var(--text);border-color:var(--fire)}

section{padding:40px 0 8px}
h2{font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
h2 svg{width:22px;height:22px;color:var(--fire)}
.lead{color:var(--muted);margin:0 0 20px;font-size:14px}

/* Переключатели */
.seg{display:inline-flex;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;gap:4px;margin-bottom:16px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px Inter;padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#ff8a2b,#d9531e);color:#1a0d05}

/* Тир-лист */
.tier{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--bg2)}
.tier-label{flex:none;width:76px;display:grid;place-items:center;font:800 34px Cinzel,serif;color:#140c06}
.tier-items{display:flex;flex-wrap:wrap;gap:10px;padding:12px;flex:1}
.hcard{position:relative;width:96px;text-align:center;cursor:pointer;border-radius:12px;padding:6px 4px 8px;
  border:1px solid transparent;transition:.15s;background:none;color:inherit;font:inherit}
.hcard:hover,.hcard.sel{background:var(--card);border-color:var(--line);transform:translateY(-2px)}
.hcard.sel{border-color:var(--fire)}
.portrait{width:72px;height:72px;margin:0 auto;border-radius:50%;padding:3px;
  background:conic-gradient(from 210deg,var(--tc),#ffffff22,var(--tc))}
.portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000;display:block}
.hname{font-weight:700;font-size:13px;margin-top:6px}
.htrait{font-size:11px;color:var(--muted);line-height:1.25}
.trend{position:absolute;top:2px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;border:2px solid var(--bg2)}
.trend.up{background:var(--up);color:#052e14}.trend.down{background:var(--down);color:#3b0909}.trend.new{background:var(--new);color:#06213f}

.detail{display:none;gap:16px;align-items:flex-start;margin-top:14px;padding:16px;border-radius:14px;
  background:linear-gradient(135deg,#ff8a2b14,transparent 60%),var(--card);border:1px solid #ff8a2b44}
.detail.show{display:flex}
.detail img{width:96px;height:96px;border-radius:14px;flex:none;border:2px solid var(--fire)}
.detail h3{margin:0 0 2px;font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#ffffff0d;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:6px 0 4px}
.legend b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;margin-right:6px}

/* Таблица билдов */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters .seg{margin:0}
input,select{background:var(--bg2);border:1px solid var(--line);color:var(--text);font:14px Inter;padding:10px 12px;border-radius:10px}
input{flex:1;min-width:180px}
input:focus,select:focus{outline:2px solid var(--fire);outline-offset:-1px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 12px;cursor:pointer;user-select:none;white-space:nowrap}
.tbl th[data-k]:hover{color:var(--text)}
.tbl th .arr{color:var(--fire)}
.tbl td{background:var(--card);padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#221e27}
.who{display:flex;gap:10px;align-items:center}
.who img{width:40px;height:40px;border-radius:50%;border:2px solid var(--tc)}
.who b{display:block;font-size:14px}.who small{color:var(--muted);font-size:12px}
.tb{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;font:800 16px Cinzel,serif;color:#140c06}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#ffffff0f;color:var(--muted);white-space:nowrap}
.dots{letter-spacing:2px;color:var(--fire2);white-space:nowrap}.dots i{color:#3a3440;font-style:normal}
.tr-up{color:var(--up);font-weight:700}.tr-down{color:var(--down);font-weight:700}
tr.more td{background:#120f15;font-size:14px;color:#cfc6d6}
tr.more .pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
tr.more .pc b{display:block;margin-bottom:2px}
tr.more .pc .p b{color:var(--up)}
tr.more .pc .c b{color:var(--down)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lnk{padding:7px 12px;border-radius:9px;background:#ff8a2b1a;border:1px solid #ff8a2b55;color:var(--fire2);text-decoration:none;font-size:13px;font-weight:600}
.lnk:hover{background:#ff8a2b33}
.lnk.yt{background:#ff00001a;border-color:#ff4d4d66;color:#ff8080}
.empty{text-align:center;color:var(--muted);padding:30px}

/* Изменения */
.changes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.ch{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.ch .ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800}
.ch.up .ic{background:#4ade8022;color:var(--up)}.ch.down .ic{background:#f8717122;color:var(--down)}.ch.new .ic{background:#60a5fa22;color:var(--new)}

.src{columns:2 300px;padding-left:18px;font-size:14px}
.src li{margin-bottom:6px}
/* Чаевые: маленькая плавающая кнопка, полупрозрачная до наведения */
.tip{position:fixed;right:16px;bottom:16px;z-index:20;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  background:#1a171ee6;border:1px solid var(--line);color:var(--muted);font:600 12px Inter;text-decoration:none;opacity:.8;
  backdrop-filter:blur(6px);box-shadow:0 4px 16px #0006;transition:.2s}
.tip:hover{opacity:1;color:var(--fire2);border-color:#ff8a2b66;transform:translateY(-2px)}
.tip .cup{font-size:15px}
footer{padding:40px 0 64px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line);margin-top:40px}
.views{margin-top:8px;font-size:11px;opacity:.6}
.like{position:relative;margin-top:20px;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid #ff8a2b55;background:#ff8a2b14;color:var(--text);font:600 14px Inter;cursor:pointer;transition:.15s}
.like:hover{background:#ff8a2b2a;transform:translateY(-1px)}
.like .heart{position:relative;display:inline-block;color:var(--muted);font-size:16px;transition:.15s}
.like.on{border-color:var(--S);background:#ff4d4d1f}
.like.on .heart{color:var(--S);transform:scale(1.2)}
.like b{color:var(--fire2)}
/* Пока не лайкнуто — пульсирующее свечение и «сердцебиение», чтобы кнопку заметили */
.like:not(.on){animation:likeGlow 2.4s ease-in-out infinite}
.like:not(.on) .heart{color:#ff8080;animation:beat 2.4s ease-in-out infinite}
@keyframes likeGlow{0%,100%{box-shadow:0 0 0 0 #ff4d4d00}50%{box-shadow:0 0 0 6px #ff4d4d1f,0 0 26px #ff8a2b66}}
@keyframes beat{0%,55%,100%{transform:scale(1)}10%{transform:scale(1.4)}20%{transform:scale(1)}30%{transform:scale(1.3)}}
/* Клик — сердце «выстреливает», разлетаются искры */
.like.pop .heart{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.8)}100%{transform:scale(1.2)}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

@media (max-width:760px){
  .tier-label{width:48px;font-size:26px}
  .tier-items{gap:4px;padding:8px}
  .hcard{width:78px;padding:6px 2px}.portrait{width:58px;height:58px}.htrait{font-size:10px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr.row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
  .tbl tr.row td{padding:0;border:0!important;background:none!important;border-radius:0!important}
  .tbl tr.row td.c-who{grid-column:1/3}.tbl tr.row td.c-tier{grid-column:3;grid-row:1}
  .tbl tr.row td.c-name{grid-column:1/4;font-weight:600}
  .tbl tr.row td.c-skill{grid-column:1/4;color:var(--muted);font-size:13px}
  .tbl tr.row td.c-stage,.tbl tr.row td.c-budget,.tbl tr.row td.c-diff{display:inline-block;width:auto}
  .tbl tr.row td.c-trend{display:none}
  tr.more td{border-radius:0 0 12px 12px!important;border:1px solid var(--line)!important;border-top:0!important;margin-top:-6px}
  tr.more .pc{grid-template-columns:1fr}
  .detail{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){.embers{display:none}*{transition:none!important;animation:none!important}}
</style>
</head>

<header>
  <div class="embers" id="embers"></div>
  <div class="wrap">
    <span class="badge" id="sBadge"></span>
    <h1>Torchlight: Infinite</h1>

<nav><div class="wrap">

<main class="wrap">

    <p class="lead" id="tierHint"></p>
    <div class="seg" id="tierSeg"></div>
    <div class="legend"><span><b style="background:var(--up);color:#052e14">▲</b><span data-i="legendUp"></span></span><span><b style="background:var(--down);color:#3b0909">▼</b><span data-i="legendDown"></span></span><span><b style="background:var(--new);color:#06213f">✦</b><span data-i="legendNew"></span></span><span data-i="legendClick"></span></div>
    <div id="tierList"></div>
    <div class="detail" id="detail"></div>
  </section>

  <section id="builds">
    <h2><svg><use href="#i-sword"/></svg><span data-i="buildsTitle"></span></h2>

      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <section id="changes">
    <h2><svg><use href="#i-bolt"/></svg><span data-i="changesTitle"></span></h2>
    <p class="lead" data-i="changesLead"></p>

  </section>

  <section id="sources">
    <h2><svg><use href="#i-book"/></svg><span data-i="sourcesTitle"></span></h2>
    <ul class="src" id="srcList"></ul>
  </section>
</main>

<footer class="wrap"><span data-i="footer"></span><div class="views" id="views" hidden></div></footer>

    start: "Start", end: "Endgame", both: "Start + endgame", all: "All", allHeroes: "All heroes",
    buildsTitle: "Build overview", buildsLead: "Click a row to see pros, cons and source. Click a column header to sort.",
    search: "Search: skill, build…", thHero: "Hero", thTier: "Tier", thBuild: "Build", thSkill: "Key skill", thStage: "Stage", thBudget: "Budget", thDiff: "Difficulty",
    diff: ["","Easy","Medium","Hard"], buff: "buff", nerf: "nerf", pros: "Pros", cons: "Cons", source: "Source", ytVideos: "Videos on YouTube", like: "Like", tip: "Buy me a coffee", tipTitle: "Support the project — leave a tip", views: "unique views", empty: "Nothing found",
    changesTitle: "What changed in SS14", changesLead: "Key changes from the official patch notes and season preview", sourcesTitle: "Sources",
    footer: "Fan project, not affiliated with XD Inc. Portraits from tlidb.com, all rights belong to the game's owners."
  }
};
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let lang = new URLSearchParams(location.search).get("lang") || store.get("lang") || (navigator.language.startsWith("ru") ? "ru" : "en");
if (!I18N[lang]) lang = "ru";
const t = k => I18N[lang][k];
const L = x => x && typeof x === "object" ? (x[lang] ?? x.ru) : x; // текст из data.js

// Шапка
const embers = $("#embers");
for (let i = 0; i < 28; i++) {
  const e = document.createElement("i");
  e.style.cssText = `left:${Math.random()*100}%;animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*6}s`;
  embers.append(e);
}
function tick() {
  const ms = new Date(D.season.start) - Date.now();
  if (ms <= 0) { $("#cd").innerHTML = `<div style="min-width:auto;padding:10px 18px"><b>${t("running")}</b></div>`; return; }
  const p = [Math.floor(ms/864e5), Math.floor(ms/36e5)%24, Math.floor(ms/6e4)%60, Math.floor(ms/1e3)%60];
  $("#cd").innerHTML = p.map((v,i) => `<div><b>${String(v).padStart(2,"0")}</b><span>${t("units")[i]}</span></div>`).join("");
}
setInterval(tick, 1000);

function seg(el, opts, cur, onPick) {
  el.innerHTML = opts.map(([k,txt]) => `<button data-k="${k}" class="${k===cur?"on":""}">${txt}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); onPick(b.dataset.k); };
}

// Тир-листы
let mode = "starter", selected = null;
function tierOf(list, id) {
  for (const [tier, arr] of Object.entries(D.tiers[list].rows)) { const r = arr.find(x => x[0] === id); if (r) return {t: tier, r}; }
}
function renderTiers() {
  const T = D.tiers[mode];
  $("#tierHint").textContent = L(T.hint);
  $("#tierList").innerHTML = Object.entries(T.rows).map(([tier, arr]) => `
    <div class="tier" style="--tc:var(--${tier})">
      <div class="tier-label" style="background:var(--${tier})">${tier}</div>
      <div class="tier-items">${arr.map(([id, tr]) => `
        <button class="hcard ${id===selected?"sel":""}" data-id="${id}" title="${esc(H[id].trait)}">
          <div class="portrait"><img src="${img(id)}" alt="${label(id)}" loading="lazy"></div>
          ${tr ? `<span class="trend ${tr}">${{up:"▲",down:"▼",new:"✦"}[tr]}</span>` : ""}
          <div class="hname">${label(id)}</div><div class="htrait">${esc(H[id].trait)}</div>
        </button>`).join("")}</div>
    </div>`).join("");
  if (selected) showDetail(selected);
}
$("#tierList").onclick = e => { const c = e.target.closest(".hcard"); if (!c) return;
  selected = selected === c.dataset.id ? null : c.dataset.id; renderTiers();
  if (selected) $("#detail").scrollIntoView({block:"nearest", behavior:"smooth"}); else $("#detail").classList.remove("show"); };

function showDetail(id) {
  const h = H[id], st = tierOf("starter", id), en = tierOf("endgame", id), cur = tierOf(mode, id);
  const builds = D.builds.filter(b => b.hero === id);
  const pill = (name, x) => x ? `<span class="pill" style="color:var(--${x.t})">${name}: ${x.t}</span>` : "";
  $("#detail").innerHTML = `
    <img src="${img(id)}" alt="">
    <div>
      <h3 class="serif">${label(id)} · ${esc(h.trait)}</h3>
      <div class="pills">${pill(t("start"), st)}${pill(t("end"), en)}</div>
      <div>${cur ? esc(L(cur.r[2])) : ""}</div>
      ${builds.length ? `<div class="pills">${builds.map(b => `<a class="pill" href="#builds" data-hero="${id}">⚔ ${esc(L(b.name))}</a>`).join("")}</div>` : ""}
    </div>`;
  $("#detail").classList.add("show");
}
$("#detail").onclick = e => { const a = e.target.closest("[data-hero]"); if (a) { $("#heroSel").value = a.dataset.hero; renderBuilds(); } };

// Таблица билдов
let stage = "all", sortK = "tier", sortDir = 1, open = new Set();
$("#heroSel").onchange = $("#q").oninput = () => renderBuilds();
document.querySelector(".tbl thead").onclick = e => { const th = e.target.closest("th[data-k]"); if (!th) return;
  sortDir = sortK === th.dataset.k ? -sortDir : 1; sortK = th.dataset.k; renderBuilds(); };

const sortVal = {
  hero: b => label(b.hero), tier: b => TIER_ORDER[b.tier], name: b => L(b.name), stage: b => b.stage,
  budget: b => b.budget, diff: b => b.diff, trend: b => ({up:0,"":1,down:2})[b.trend]
};
const ytSearch = b => "https://www.youtube.com/results?search_query=" +
  encodeURIComponent(`Torchlight Infinite ${D.season.code} ${label(b.hero)} ${H[b.hero].trait} ${typeof b.name === "object" ? b.name.en : b.name}`);
function renderBuilds() {
  const hero = $("#heroSel").value, q = $("#q").value.trim().toLowerCase();
  const rows = D.builds.map((b, i) => ({...b, i}))
    .filter(b => stage === "all" || b.stage === stage || b.stage === "both")
    .filter(b => !hero || b.hero === hero)
    .filter(b => !q || [label(b.hero), H[b.hero].trait, L(b.name), L(b.skill), L(b.pros), L(b.cons)].join(" ").toLowerCase().includes(q))
    .sort((a, b) => { const x = sortVal[sortK](a), y = sortVal[sortK](b);
      return (x > y ? 1 : x < y ? -1 : TIER_ORDER[a.tier] - TIER_ORDER[b.tier]) * sortDir; });
  document.querySelectorAll(".tbl th[data-k]").forEach(th =>
    th.innerHTML = (th.dataset.i ? t(th.dataset.i) : "SS14") + (th.dataset.k === sortK ? ` <span class="arr">${sortDir>0?"▲":"▼"}</span>` : ""));
  $("#tbody").innerHTML = rows.length ? rows.map(b => `
    <tr class="row" data-i="${b.i}" style="--tc:var(--${b.tier})">
      <td class="c-who"><div class="who"><img src="${img(b.hero)}" alt="" loading="lazy"><div><b>${label(b.hero)}</b><small>${esc(H[b.hero].trait)}</small></div></div></td>
      <td class="c-tier"><span class="tb" style="background:var(--${b.tier})">${b.tier}</span></td>
      <td class="c-name">${esc(L(b.name))}</td>
      <td class="c-skill">${esc(L(b.skill))}</td>
      <td class="c-stage"><span class="tag">${t(b.stage)}</span></td>
      <td class="c-budget" title="${t("thBudget")}"><span class="dots">${dots(b.budget)}</span></td>
      <td class="c-diff" title="${t("thDiff")}"><span class="tag">${t("diff")[b.diff]}</span></td>
      <td class="c-trend">${b.trend==="up"?`<span class="tr-up">▲ ${t("buff")}</span>`:b.trend==="down"?`<span class="tr-down">▼ ${t("nerf")}</span>`:"—"}</td>
    </tr>
    ${open.has(b.i) ? `<tr class="more"><td colspan="8"><div class="pc"><div class="p"><b>${t("pros")}</b>${esc(L(b.pros))}</div><div class="c"><b>${t("cons")}</b>${esc(L(b.cons))}</div></div>
      <div class="links">${(b.links || []).map(([s,u]) => `<a class="lnk" href="${u}" target="_blank" rel="noopener">📖 ${esc(L(s))}</a>`).join("")}
        <a class="lnk yt" href="${ytSearch(b)}" target="_blank" rel="noopener">▶ ${t("ytVideos")}</a></div>
      <div style="margin-top:8px;color:var(--muted);font-size:12px">${t("source")}: ${esc(L(b.src))}</div></td></tr>` : ""}`).join("")
    : `<tr><td colspan="8" class="empty">${t("empty")}</td></tr>`;
}
$("#tbody").onclick = e => { const r = e.target.closest("tr.row"); if (!r) return;
  const i = +r.dataset.i; open.has(i) ? open.delete(i) : open.add(i); renderBuilds(); };

// Перерисовка всего при смене языка
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i]:not([data-k])").forEach(el => el.textContent = t(el.dataset.i));
  $("#sBadge").textContent = `${t("season")} ${D.season.code} · ${D.season.name}`;
  const upd = new Date(D.season.updatedAt), loc = lang === "ru" ? "ru-RU" : "en-US", hrs = Math.round((upd - Date.now()) / 36e5);
  $("#sUpd").textContent = upd.toLocaleString(loc, {dateStyle: "medium", timeStyle: "short"});
  $("#sAgo").textContent = "(" + new Intl.RelativeTimeFormat(loc, {numeric: "auto"}).format(Math.abs(hrs) < 24 ? hrs : Math.round(hrs / 24), Math.abs(hrs) < 24 ? "hour" : "day") + ")";
  $("#sStart").textContent = L(D.season.startLabel);
  $("#sNote").textContent = L(D.season.note);
  $("#q").placeholder = t("search");
  $("#tip").title = t("tipTitle");
  const h = $("#heroSel").value;
  $("#heroSel").innerHTML = `<option value="">${t("allHeroes")}</option>` + [...new Set(D.builds.map(b => b.hero))].sort()
    .map(id => `<option value="${id}">${label(id)} — ${esc(H[id].trait)}</option>`).join("");
  $("#heroSel").value = h;
  seg($("#tierSeg"), Object.entries(D.tiers).map(([k,v]) => [k, L(v.title)]), mode, k => { mode = k; renderTiers(); });
  seg($("#stageSeg"), [["all",t("all")],["start",t("start")],["end",t("end")]], stage, k => { stage = k; renderBuilds(); });
  $("#chList").innerHTML = D.changes.map(c => `<div class="ch ${c.type}"><span class="ic">${{up:"▲",down:"▼",new:"✦"}[c.type]}</span><span>${esc(L(c.text))}</span></div>`).join("");
  $("#srcList").innerHTML = D.sources.map(([s,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(L(s))}</a></li>`).join("");
  tick(); renderTiers(); renderBuilds(); renderStats();
}

// Лайки и уникальные просмотры (Cloudflare Pages Function + D1). Нет бэкенда — блоки скрыты.
let stats = null;
const visitor = store.get("visitor") || crypto.randomUUID();
store.set("visitor", visitor);
function renderStats() {
  if (!stats) return;
  $("#likeBtn").hidden = $("#views").hidden = false;
  $("#likeBtn").classList.toggle("on", stats.liked);
  $("#likeN").textContent = stats.likes;
  $("#views").textContent = `👁 ${stats.views} ${t("views")}`;
}
async function sendStats(extra) {
  try {
    const r = await fetch("api/stats", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id: visitor, ...extra }) });
    if (r.ok) { stats = await r.json(); renderStats(); }
  } catch {}
}
function burst() {
  const btn = $("#likeBtn"), heart = btn.querySelector(".heart");
  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("i"), a = i / 14 * 2 * Math.PI, r = 28 + Math.random() * 22;
    s.className = "spark";
    s.style.cssText = `--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r}px;--c:${["#ff4d4d","#ff8a2b","#ffcf6b"][i % 3]}`;
    heart.append(s); setTimeout(() => s.remove(), 750);
  }
}
$("#likeBtn").onclick = () => {
  stats.liked = !stats.liked; if (stats.liked) burst(); stats.likes += stats.liked ? 1 : -1; renderStats(); // сразу, не дожидаясь сервера
  sendStats({ like: stats.liked });
};
sendStats();
seg($("#langSeg"), [["ru","RU"],["en","EN"]], lang, k => { lang = k; store.set("lang", k); applyLang(); });
applyLang();

// Подсветка пункта меню
const links = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting)
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), {rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("main section").forEach(s => io.observe(s));
</script>
</body>
</html>
